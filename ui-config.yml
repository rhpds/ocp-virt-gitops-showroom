---
type: showroom

# Set the left column width to 40% for longer lab instructions
default_width: 40
# Persist the URL state so browser refresh doesn't reset the UI
persist_url_state: true

view_switcher:
  enabled: false
  default_mode: instructions

tabs:
  # ttyd terminal proxied by nginx at /terminal/ (port 7681 in the pod)
  - name: Terminal
    path: /terminal/
    port: 443

  # OpenShift Console cannot be iframed (X-Frame-Options: DENY).
  # Open in a new browser tab instead of embedding.
  - name: OCP Console
    url: 'https://console-openshift-console.${DOMAIN}'
    external: true
